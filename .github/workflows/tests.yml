name: Test Suites

# We are a reusable Workflow only
on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

env:
  MODULE_ID: ${{ github.event.repository.name }}

jobs:
  tests:
    name: Tests ${{ github.event.repository.name }}
    runs-on: ${{ matrix.os }}
    env:
      DB_USER: root
      DB_PASSWORD: root
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest", "windows-latest" ]
        jdkVersion: [ "21" ]
        experimental: [false]
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: ${{ matrix.jdkVersion }}

      # - name: Setup Database and Fixtures
      #   run: |
      #     sudo systemctl start mysql.service
      #     mysql -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }} -e 'CREATE DATABASE mementifier;'
      #     mysql -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }} < test-harness/tests/resources/coolblog.sql

      #- name: Setup CommandBox CLI
      #  uses: Ortus-Solutions/setup-commandbox@v2.0.1

      # Not Needed in this module
      #- name: Setup Environment For Testing Process
      #  run: |
      #    # Setup .env
      #    touch .env
      #    # ENV
      #    printf "DB_HOST=localhost\n" >> .env
      #    printf "DB_DATABASE=mydatabase\n" >> .env
      #    printf "DB_DRIVER=MySQL\n" >> .env
      #    printf "DB_USER=${{ env.DB_USER }}\n" >> .env
      #    printf "DB_PASSWORD=${{ env.DB_PASSWORD }}\n" >> .env
      #    printf "DB_CLASS=com.mysql.cj.jdbc.Driver\n" >> .env
      #    printf "DB_BUNDLEVERSION=8.0.19\n" >> .env
      #    printf "DB_BUNDLENAME=com.mysql.cj\n" >> .env

      # Node.js and browsers downloaded by the end-to-end tests
      - name: Cache Playwright Home
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: build/playwright-home
          key: playwright-home-${{ runner.os }}-${{ hashFiles( 'gradle.properties' ) }}

      - name: Test Module
        env:
          # End-to-end tests drive a real browser, only on Linux
          PLAYWRIGHT_E2E: ${{ runner.os == 'Linux' }}
        run: |
          ./gradlew downloadBoxLang
          # this is done in order to build the module structure before testing
          ./gradlew shadowJar test --stacktrace --console=plain

      - name: Test Full Distribution
        if: runner.os == 'Linux'
        run: |
          ./gradlew shadowJar test -Pflavor=full --tests '*PlaywrightHomeTest' --stacktrace --console=plain

      - name: Publish Test Reports
        uses: mikepenz/action-junit-report@v6.5.0
        if: always()
        with:
          report_paths: |
            **/build/test-results/test/*.xml
            **/surefire-reports/*.xml
            **/failsafe-reports/*.xml
          check_name: "Tests Report ${{ matrix.os }}-${{ matrix.jdkVersion }}"
          include_passed: false
          fail_on_failure: true
          detailed_summary: true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}-${{ matrix.jdkVersion }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

      - name: Inform Slack
        if: ${{ failure() && github.ref == 'refs/heads/development' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: coding
          SLACK_COLOR: ${{ job.status }} # or a specific color like 'green' or '#ff00ff'
          SLACK_ICON_EMOJI: ":bell:"
          SLACK_MESSAGE: "${{ env.MODULE_ID }} Tests FAILED!  You broke the build! :("
          SLACK_TITLE: "${{ env.MODULE_ID }} Build Failure"
          SLACK_USERNAME: CI
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          MSG_MINIMAL: true

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup BoxLang and bxSites
        uses: ortus-boxlang/setup-boxlang@main
        with:
          version: latest
          modules: bx-sites bx-markdown bx-esapi bx-yaml bx-image

      # Build the site, then fail on lint issues, broken links or missing alt text
      - name: Build and Check Docs
        run: |
          export PATH="$HOME/.boxlang/bin:$PATH"
          bxSites -v
          bxSites lint
          bxSites build
          test -s site/index.html
          test -s site/404.html
          bxSites audit
