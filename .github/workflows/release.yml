# This workflow is used to build releases
# It can also be called by other workflows to reuse the release flow.
name: Release

on:
  # If you push to main this will trigger a stable release
  push:
    branches:
      - master
      - main

  # Reusable workflow : Usually called by a `snapshot` workflow
  workflow_call:
    inputs:
      snapshot:
        description: "Is this a snapshot build?"
        required: false
        default: false
        type: boolean

  # Manual Trigger
  workflow_dispatch:

env:
  MODULE_ID: ${{ github.event.repository.name }}
  JDK: 21
  BUILD_ID: ${{ github.run_number }}
  # Builds from development (including a manual run on it) are always snapshots: never tag, finalize the changelog or release them
  SNAPSHOT: ${{ inputs.snapshot || github.ref == 'refs/heads/development' }}

jobs:
  #############################################
  # Build Snapshot or Final Release
  #############################################
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.current_version.outputs.version }}
    permissions:
      checks: write
      pull-requests: write
      contents: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1
        with:
          forgeboxAPIKey: ${{ secrets.FORGEBOX_API_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: ${{ env.JDK }}

      - name: Setup Environment Variables For Build Process
        id: current_version
        run: |
          # Read Version from gradle.properties
          TMPVERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          # Replace existing prerelease identifier with -snapshot or append -snapshot if none exists
          # If we are on the development branch, we always append -snapshot
          if [[ "${{ github.ref }}" == "refs/heads/development" ]]; then
            TMPVERSION=$(echo $TMPVERSION | sed 's/-.*$//')-snapshot
          fi
          # Set the version in the environment, and as an output for the next release prep
          echo "VERSION=$TMPVERSION" >> $GITHUB_ENV
          echo "version=$TMPVERSION" >> $GITHUB_OUTPUT
          # A snapshot version is never tagged or released, whatever triggered the build
          if [[ "$TMPVERSION" == *-snapshot ]]; then
            echo "SNAPSHOT=true" >> $GITHUB_ENV
          fi

          # Branch
          echo "Github Ref is $GITHUB_REF"
          echo "BRANCH=main" >> $GITHUB_ENV

          # Snapshot
          if [ $GITHUB_REF == 'refs/heads/development' ]
          then
            echo "BRANCH=development" >> $GITHUB_ENV
          fi

      - name: Update changelog [unreleased] with latest version
        uses: thomaseizinger/keep-a-changelog-new-release@3.1.0
        if: env.SNAPSHOT == 'false'
        with:
          changelogPath: ./changelog.md
          tag: v${{ env.VERSION }}

      - name: Build it!
        run: |
          npm install -g markdownlint-cli
          markdownlint changelog.md --fix
          ./gradlew downloadBoxLang
          # Small distribution: bx-playwright
          ./gradlew build -x test --stacktrace --console=plain
          cp -r build/module build/module-small
          # Full distribution: bx-playwright-full (bundles Node.js for every platform)
          # Its zip lands next to the small one in build/distributions, so one S3 upload ships both
          ./gradlew shadowJar -Pflavor=full -x test --stacktrace --console=plain
          mv build/module build/module-full

      - name: Commit Changelog [unreleased] with latest version
        uses: EndBug/add-and-commit@v11.1.1
        if: env.SNAPSHOT == 'false'
        with:
          author_name: Github Actions
          author_email: info@ortussolutions.com
          message: "Finalized changelog for v${{ env.VERSION }}"
          add: changelog.md

      - name: Tag Version
        uses: rickstaa/action-create-tag@v1.7.2
        if: env.SNAPSHOT == 'false'
        with:
          tag: "v${{ env.VERSION }}"
          force_push_tag: true
          message: "Latest Release v${{ env.VERSION }}"

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: boxlang-build
          path: |
            build/reports/tests/**
            changelog.md

      # One upload ships both zips: bx-playwright-{version}.zip and bx-playwright-full-{version}.zip
      - name: Upload Distributions to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read
        env:
          AWS_S3_BUCKET: "downloads.ortussolutions.com"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
          SOURCE_DIR: "build/distributions"
          DEST_DIR: "ortussolutions/boxlang-modules/${{ env.MODULE_ID }}/${{ env.VERSION }}"

      - name: Upload API Docs to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read
        env:
          AWS_S3_BUCKET: "apidocs.ortussolutions.com"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
          SOURCE_DIR: "build/docs/javadoc"
          DEST_DIR: "boxlang-modules/${{ env.MODULE_ID }}/${{ env.VERSION }}"

      # ForgeBox only receives the box.json of each module: its location points to the zip on S3,
      # so the size of the full zip does not matter. Two publishes create two ForgeBox entries.
      - name: Publish to ForgeBox
        run: |
          cd build/module-small
          box forgebox publish --force
          cd $GITHUB_WORKSPACE/build/module-full
          box forgebox publish --force
          cd $GITHUB_WORKSPACE

      - name: Create Github Release
        uses: taiki-e/create-gh-release-action@v1.11.0
        continue-on-error: true
        if: env.SNAPSHOT == 'false'
        id: create_release
        with:
          title: ${{ env.VERSION }}
          changelog: changelog.md
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refs/tags/v${{ env.VERSION }}

      - name: Inform Slack
        if: ${{ always() }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: coding
          SLACK_COLOR: ${{ job.status }} # or a specific color like 'green' or '#ff00ff'
          SLACK_ICON_EMOJI: ":bell:"
          SLACK_MESSAGE: "Module ${{ env.MODULE_ID }} v${{ env.VERSION }} Built with ${{ job.status }}!"
          SLACK_TITLE: "BoxLang Module ${{ env.MODULE_ID }}"
          SLACK_USERNAME: CI
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

  ##########################################################################################
  # Prep Next Release
  ##########################################################################################
  prep_next_release:
    name: Prep Next Release
    if: github.ref != 'refs/heads/development'
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      checks: write
      pull-requests: write
      contents: write
      issues: write
    steps:
      - name: Checkout Development Repository
        uses: actions/checkout@v7
        with:
          ref: development

      # The released commit: its docs/ is what shipped
      - name: Checkout Released Docs
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release
          sparse-checkout: |
            docs
            bxsites.yaml

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: ${{ env.JDK }}

      - name: Setup BoxLang and bxSites
        uses: ortus-boxlang/setup-boxlang@main
        with:
          version: latest
          modules: bx-sites bx-markdown bx-esapi bx-yaml bx-image

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: boxlang-build
          path: .tmp

      - name: Copy Changelog
        run: |
          cp .tmp/changelog.md changelog.md

      - name: Bump Version
        run: |
          ./gradlew bumpMinorVersion --stacktrace --console=plain
          git pull

      # Lock the released docs into docs/versions/MAJOR.MINOR.x and serve them at the site root.
      # docs/ keeps going as the next version, served at /next/.
      - name: Lock the Released Docs
        run: |
          export PATH="$HOME/.boxlang/bin:$PATH"
          ./.github/scripts/lock-docs-version.sh "${{ needs.build.outputs.version }}" .release .
          rm -rf .release

      - name: Commit Version Bump
        uses: EndBug/add-and-commit@v11.1.1
        with:
          author_name: Github Actions
          author_email: info@ortussolutions.com
          message: "Version bump, docs of v${{ needs.build.outputs.version }} locked"
          add: |
            gradle.properties
            changelog.md
            bxsites.yaml
            docs/versions

  ##########################################################################################
  # Publish the docs with the released version locked
  # (the commit above is pushed with the workflow token, which does not trigger docs.yml)
  ##########################################################################################
  publish_docs:
    name: Publish Docs
    if: github.ref != 'refs/heads/development'
    needs: [prep_next_release]
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: development
      publish: true
